<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 12px;
      background: #102018;
      color: #eaffef;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      color: #7cff9b;
    }

    .scores {
      display: flex;
      justify-content: space-between;
      margin: 12px 0;
      font-size: 16px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #07130c;
      border: 3px solid #3d7850;
      border-radius: 12px;
      touch-action: none;
    }

    #message {
      min-height: 24px;
      margin: 12px 0;
      color: #b9ffc9;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      background: #4bd477;
      color: #092012;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .controls {
      display: grid;
      grid-template-columns: 65px 65px 65px;
      grid-template-rows: 55px 55px;
      justify-content: center;
      gap: 8px;
      margin: 16px auto 10px;
    }

    .controls button {
      padding: 0;
      font-size: 24px;
      background: #245b38;
      color: white;
      border: 2px solid #5fbd7d;
      user-select: none;
      -webkit-user-select: none;
    }

    .controls button:active {
      background: #4bd477;
      color: #092012;
    }

    .up {
      grid-column: 2;
      grid-row: 1;
    }

    .left {
      grid-column: 1;
      grid-row: 2;
    }

    .down {
      grid-column: 2;
      grid-row: 2;
    }

    .right {
      grid-column: 3;
      grid-row: 2;
    }

    .hint {
      font-size: 13px;
      color: #a6c8b0;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="game">
    <h1>🐍 Snake Game</h1>

    <div class="scores">
      <span>Skor: <b id="score">0</b></span>
      <span>Rekor: <b id="best">0</b></span>
    </div>

    <canvas id="board" width="360" height="360"></canvas>

    <p id="message">Tekan tombol arah untuk mulai!</p>

    <button id="restart">Mulai ulang</button>

    <div class="controls">
      <button class="up" data-direction="up" aria-label="Atas">▲</button>
      <button class="left" data-direction="left" aria-label="Kiri">◀</button>
      <button class="down" data-direction="down" aria-label="Bawah">▼</button>
      <button class="right" data-direction="right" aria-label="Kanan">▶</button>
    </div>

    <p class="hint">
      Laptop: gunakan tombol panah atau WASD.<br>
      HP: sentuh tombol arah di atas.
    </p>
  </main>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const bestText = document.getElementById("best");
    const message = document.getElementById("message");
    const restartButton = document.getElementById("restart");

    const tileSize = 18;
    const tileCount = canvas.width / tileSize;

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score;
    let best = Number(localStorage.getItem("snakeBest")) || 0;
    let gameOver;
    let gameStarted;
    let gameTimer;

    bestText.textContent = best;

    function startGame() {
      clearInterval(gameTimer);

      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];

      direction = "right";
      nextDirection = "right";
      score = 0;
      gameOver = false;
      gameStarted = false;

      scoreText.textContent = score;
      message.textContent = "Tekan tombol arah untuk mulai!";

      placeFood();
      draw();

      gameTimer = setInterval(updateGame, 160);
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      } while (snake.some(part => part.x === food.x && part.y === food.y));
    }

    function changeDirection(newDirection) {
      if (gameOver) return;

      const opposite = {
        up: "down",
        down: "up",
        left: "right",
        right: "left"
      };

      if (newDirection === opposite[direction]) return;

      nextDirection = newDirection;
      gameStarted = true;
      message.textContent = "";
    }

    function updateGame() {
      if (gameOver || !gameStarted) return;

      direction = nextDirection;

      const head = { ...snake[0] };

      if (direction === "up") head.y--;
      if (direction === "down") head.y++;
      if (direction === "left") head.x--;
      if (direction === "right") head.x++;

      // Menabrak dinding
      if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= tileCount ||
        head.y >= tileCount
      ) {
        endGame();
        return;
      }

      const eating = head.x === food.x && head.y === food.y;
      const bodyToCheck = eating ? snake : snake.slice(0, -1);

      // Menabrak badan sendiri
      if (bodyToCheck.some(part => part.x === head.x && part.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (eating) {
        score++;
        scoreText.textContent = score;

        if (score > best) {
          best = score;
          bestText.textContent = best;
          localStorage.setItem("snakeBest", best);
        }

        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = "#07130c";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Makanan
      ctx.fillStyle = "#ff5c66";
      ctx.beginPath();
      ctx.arc(
        food.x * tileSize + tileSize / 2,
        food.y * tileSize + tileSize / 2,
        tileSize / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // Ular
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#a0ffb5" : "#4bd477";
        ctx.fillRect(
          part.x * tileSize + 1,
          part.y * tileSize + 1,
          tileSize - 2,
          tileSize - 2
        );
      });
    }

    function endGame() {
      gameOver = true;
      gameStarted = false;
      clearInterval(gameTimer);
      message.textContent = "Game Over! Tekan Mulai ulang untuk bermain lagi.";
    }

    // Kontrol keyboard laptop
    document.addEventListener("keydown", function(event) {
      const keys = {
        ArrowUp: "up",
        ArrowDown: "down",
        ArrowLeft: "left",
        ArrowRight: "right",
        w: "up",
        s: "down",
        a: "left",
        d: "right",
        W: "up",
        S: "down",
        A: "left",
        D: "right"
      };

      if (keys[event.key]) {
        event.preventDefault();
        changeDirection(keys[event.key]);
      }
    });

    // Kontrol tombol sentuh HP
    document.querySelectorAll("[data-direction]").forEach(button => {
      button.addEventListener("pointerdown", function(event) {
        event.preventDefault();
        changeDirection(button.dataset.direction);
      });
    });

    restartButton.addEventListener("click", startGame);

    startGame();
  </script>
</body>
</html>
