<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #101810;
            color: white;
            font-family: Arial, sans-serif;
        }

        .game-container {
            width: min(92vw, 460px);
            padding: 24px;
            text-align: center;
            background: #1b281b;
            border: 2px solid #4b5a75;
            border-radius: 16px;
            box-shadow: 0 0 25px #0008;
        }

        h1 {
            margin: 0 0 8px;
            color: #7c65ff;
        }

        .description {
            margin: 0 0 18px;
            color: #c5d5c5;
        }

        .info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-weight: bold;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #080e08;
            border: 2px solid #555274;
            border-radius: 8px;
        }

        button {
            margin-top: 16px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #65c1ff;
            color: #102010;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #9b94ff;
        }

        #message {
            min-height: 22px;
            margin: 12px 0 0;
            color: #c5d5c5;
        }

        .help {
            margin: 12px 0 0;
            color: #9eaf9e;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <main class="game-container">
        <h1>🐍 SNAKE GAME</h1>
        <p class="description">Makan apel, tumbuh lebih panjang!</p>

        <div class="info">
            <span>Skor: <span id="score">0</span></span>
            <span>Rekor: <span id="best">0</span></span>
        </div>

        <canvas id="game" width="400" height="400"></canvas>

        <button id="start-button">START GAME</button>

        <p id="message">Tekan START untuk bermain.</p>
        <p class="help">Gerakkan cacing dengan tombol panah atau W, A, S, D.</p>
    </main>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");
        const bestDisplay = document.getElementById("best");
        const message = document.getElementById("message");
        const startButton = document.getElementById("start-button");

        const cellSize = 20;
        const cells = canvas.width / cellSize;

        let snake;
        let food;
        let direction;
        let nextDirection;
        let score = 0;
        let best = 0;
        let gameRunning = false;
        let gameTimer;

        function startGame() {
            clearInterval(gameTimer);

            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];

            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;

            scoreDisplay.textContent = score;
            message.textContent = "Ayo makan apel!";
            startButton.textContent = "RESTART";

            placeFood();
            gameRunning = true;
            drawGame();

            gameTimer = setInterval(updateGame, 250);
        }

        function placeFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * cells),
                    y: Math.floor(Math.random() * cells)
                };
            } while (snake.some(part => part.x === food.x && part.y === food.y));
        }

        function updateGame() {
            direction = nextDirection;

            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            const hitWall =
                head.x < 0 || head.x >= cells ||
                head.y < 0 || head.y >= cells;

            const ateFood = head.x === food.x && head.y === food.y;

            const bodyToCheck = ateFood ? snake : snake.slice(0, -1);
            const hitSelf = bodyToCheck.some(
                part => part.x === head.x && part.y === head.y
            );

            if (hitWall || hitSelf) {
                endGame();
                return;
            }

            snake.unshift(head);

            if (ateFood) {
                score++;
                scoreDisplay.textContent = score;

                if (score > best) {
                    best = score;
                    bestDisplay.textContent = best;
                }

                placeFood();
            } else {
                snake.pop();
            }

            drawGame();
        }

        function drawGame() {
            ctx.fillStyle = "#080e08";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Menggambar apel
            ctx.fillStyle = "#ff4545";
            ctx.fillRect(
                food.x * cellSize + 3,
                food.y * cellSize + 3,
                cellSize - 6,
                cellSize - 6
            );

            // Menggambar cacing
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#b5ff80" : "#62d94e";

                ctx.fillRect(
                    part.x * cellSize + 1,
                    part.y * cellSize + 1,
                    cellSize - 2,
                    cellSize - 2
                );
            });
        }

        function endGame() {
            gameRunning = false;
            clearInterval(gameTimer);
            message.textContent = "GAME OVER! Skor kamu: " + score;
            startButton.textContent = "MAIN LAGI";
        }

        document.addEventListener("keydown", function(event) {
            const key = event.key.toLowerCase();

            if (["arrowup", "arrowdown", "arrowleft", "arrowright"].includes(key)) {
                event.preventDefault();
            }

            if (key === "arrowup" || key === "w") {
                if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
            }

            if (key === "arrowdown" || key === "s") {
                if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
            }

            if (key === "arrowleft" || key === "a") {
                if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
            }

            if (key === "arrowright" || key === "d") {
                if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
            }
        });

        startButton.addEventListener("click", startGame);

        drawGame();
    </script>

</body>
</html>
